<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mis Clases | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/instructor/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/instructor/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link active" th:href="@{/instructor/mis-clases}"><i class="bi bi-calendar3"></i> Mis Clases</a></li>
        <li><a class="nav-link" th:href="@{/instructor/horario/pdf}"><i class="bi bi-file-earmark-pdf"></i> Horario PDF</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-calendar3"></i> Mis Clases</div>
            <div class="page-subtitle" th:text="'Entrenador: ' + ${entrenador.nombreCompleto}"></div>
        </div>
        <a th:href="@{/instructor/horario/pdf}" class="btn btn-success">
            <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
        </a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Tipo</th><th>Fecha</th><th>Horario</th><th>Sala</th><th>Alumnos</th><th>Nivel</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(clases)}">
                    <td colspan="7" style="text-align:center; padding:2rem; color:#888;">No tienes clases asignadas</td>
                </tr>
                <tr th:each="c : ${clases}">
                    <td><strong th:text="${c.tipoClase.nombre}"></strong></td>
                    <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(c.horaInicio, 'HH:mm') + ' - ' + #temporals.format(c.horaFin, 'HH:mm')}"></td>
                    <td th:text="${c.sala != null ? c.sala : '-'}"></td>
                    <td th:text="${c.plazasOcupadas + '/' + c.aforoMaximo}"></td>
                    <td><span class="badge badge-purple" th:text="${c.tipoClase.nivel}"></span></td>
                    <td>
                        <a th:href="@{/instructor/mis-clases/{id}/alumnos(id=${c.id})}" class="btn btn-outline btn-sm">
                            <i class="bi bi-people"></i> Alumnos
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
