<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | PurpleForce Gym' : 'PurpleForce Gym'}">PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym
    </a>

    <ul class="navbar-nav">
        <!-- Links ADMIN -->
        <li sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/clases}"><i class="bi bi-calendar3"></i> Clases</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/entrenadores}"><i class="bi bi-person-badge"></i> Entrenadores</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/usuarios}"><i class="bi bi-people"></i> Usuarios</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/informes}"><i class="bi bi-bar-chart"></i> Informes</a>
        </li>

        <!-- Links INSTRUCTOR -->
        <li sec:authorize="hasRole('INSTRUCTOR')">
            <a class="nav-link" th:href="@{/instructor/dashboard}"><i class="bi bi-house"></i> Inicio</a>
        </li>
        <li sec:authorize="hasRole('INSTRUCTOR')">
            <a class="nav-link" th:href="@{/instructor/mis-clases}"><i class="bi bi-calendar3"></i> Mis Clases</a>
        </li>

        <!-- Links SOCIO -->
        <li sec:authorize="hasRole('SOCIO')">
            <a class="nav-link" th:href="@{/socio/dashboard}"><i class="bi bi-house"></i> Inicio</a>
        </li>
        <li sec:authorize="hasRole('SOCIO')">
            <a class="nav-link" th:href="@{/socio/clases}"><i class="bi bi-calendar3"></i> Clases</a>
        </li>
        <li sec:authorize="hasRole('SOCIO')">
            <a class="nav-link" th:href="@{/socio/mis-reservas}"><i class="bi bi-bookmark-check"></i> Mis Reservas</a>
        </li>
        <li sec:authorize="hasRole('SOCIO')">
            <a class="nav-link" th:href="@{/socio/ranking}"><i class="bi bi-trophy"></i> Ranking</a>
        </li>

        <!-- Login/Logout -->
        <li sec:authorize="isAuthenticated()">
            <span class="nav-user">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">Usuario</span>
            </span>
        </li>
        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem; padding:0.4rem 0.8rem;">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <a class="btn btn-primary" th:href="@{/auth/login}">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </a>
        </li>
    </ul>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container page-content">
    <!-- Alertas globales -->
    <div th:if="${exito}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
    </div>

    <!-- Bloque de contenido específico de cada página -->
    <th:block th:replace="${content}"></th:block>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
