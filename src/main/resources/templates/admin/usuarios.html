<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Usuarios | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link" th:href="@{/admin/clases}">Clases</a></li>
        <li><a class="nav-link" th:href="@{/admin/entrenadores}">Entrenadores</a></li>
        <li><a class="nav-link active" th:href="@{/admin/usuarios}">Usuarios</a></li>
        <li><a class="nav-link" th:href="@{/admin/informes}">Informes</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-people"></i> Usuarios del sistema</div>
        </div>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus-fill"></i> Nuevo usuario</a>
    </div>

    <div th:if="${exito}" class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Alta</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td><strong th:text="${u.nombreCompleto}"></strong></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span th:if="${u.rol.name() == 'ADMIN'}" class="badge badge-danger">Admin</span>
                        <span th:if="${u.rol.name() == 'INSTRUCTOR'}" class="badge badge-warning">Instructor</span>
                        <span th:if="${u.rol.name() == 'SOCIO'}" class="badge badge-purple">Socio</span>
                    </td>
                    <td th:text="${u.fechaAlta != null ? #temporals.format(u.fechaAlta, 'dd/MM/yyyy') : '-'}"></td>
                    <td>
                        <span th:if="${u.activo}" class="badge badge-success">Activo</span>
                        <span th:unless="${u.activo}" class="badge badge-danger">Inactivo</span>
                    </td>
                    <td>
                        <form th:if="${u.activo}" th:action="@{/admin/usuarios/{id}/desactivar(id=${u.id})}" method="post"
                              onsubmit="return confirm('¿Desactivar este usuario?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-person-dash"></i> Desactivar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
