<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Panel Instructor | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/instructor/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link active" th:href="@{/instructor/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link" th:href="@{/instructor/mis-clases}"><i class="bi bi-calendar3"></i> Mis Clases</a></li>
        <li><a class="nav-link" th:href="@{/instructor/horario/pdf}"><i class="bi bi-file-earmark-pdf"></i> Horario PDF</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title">¡Hola, <span th:text="${entrenador.nombre}">Instructor</span>! 🏋️</div>
            <div class="page-subtitle" th:text="'Especialidad: ' + ${entrenador.especialidad}"></div>
        </div>
        <a th:href="@{/instructor/horario/pdf}" class="btn btn-success">
            <i class="bi bi-file-earmark-pdf"></i> Descargar horario PDF
        </a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-number" th:text="${totalClases}">0</div>
            <div class="stat-label">Clases asignadas</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-calendar-week-fill"></i> Mis próximas clases</div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(misClases)}" style="color:#888; text-align:center; padding:2rem;">
                No tienes clases asignadas próximamente
            </div>
            <div class="table-wrapper" style="box-shadow:none;" th:unless="${#lists.isEmpty(misClases)}">
                <table>
                    <thead>
                        <tr>
                            <th>Tipo de Clase</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Sala</th>
                            <th>Alumnos inscritos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${misClases}">
                            <td><strong th:text="${c.tipoClase.nombre}"></strong></td>
                            <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(c.horaInicio, 'HH:mm') + ' - ' + #temporals.format(c.horaFin, 'HH:mm')}"></td>
                            <td th:text="${c.sala != null ? c.sala : '-'}"></td>
                            <td>
                                <span th:text="${c.plazasOcupadas + '/' + c.aforoMaximo}"></span>
                                <span th:if="${c.plazasLibres == 0}" class="badge badge-danger" style="margin-left:4px;">Lleno</span>
                            </td>
                            <td>
                                <a th:href="@{/instructor/mis-clases/{id}/alumnos(id=${c.id})}" class="btn btn-outline btn-sm">
                                    <i class="bi bi-people"></i> Ver alumnos
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
