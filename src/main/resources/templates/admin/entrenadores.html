<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrenadores | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link" th:href="@{/admin/clases}">Clases</a></li>
        <li><a class="nav-link active" th:href="@{/admin/entrenadores}">Entrenadores</a></li>
        <li><a class="nav-link" th:href="@{/admin/tipos-clase}">Tipos</a></li>
        <li><a class="nav-link" th:href="@{/admin/ejercicios}">Ejercicios</a></li>
        <li><a class="nav-link" th:href="@{/admin/usuarios}">Usuarios</a></li>
        <li><a class="nav-link" th:href="@{/admin/informes}">Informes</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-person-badge"></i> Entrenadores</div>
            <div class="page-subtitle">Gestiona el equipo de instructores del gimnasio</div>
        </div>
        <a th:href="@{/admin/entrenadores/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo entrenador</a>
    </div>

    <div th:if="${exito}" class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Nombre</th><th>Especialidad</th><th>Email</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(entrenadores)}">
                    <td colspan="6" style="text-align:center; padding:2rem; color:#888;">No hay entrenadores registrados</td>
                </tr>
                <tr th:each="e : ${entrenadores}">
                    <td><strong th:text="${e.nombreCompleto}"></strong></td>
                    <td th:text="${e.especialidad}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.telefono != null ? e.telefono : '-'}"></td>
                    <td>
                        <span th:if="${e.activo}" class="badge badge-success">Activo</span>
                        <span th:unless="${e.activo}" class="badge badge-danger">Inactivo</span>
                    </td>
                    <td>
                        <div style="display:flex; gap:0.4rem;">
                            <a th:href="@{/admin/entrenadores/{id}/editar(id=${e.id})}" class="btn btn-outline btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:if="${e.activo}" th:action="@{/admin/entrenadores/{id}/eliminar(id=${e.id})}" method="post"
                                  onsubmit="return confirm('¿Desactivar este entrenador?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-person-x"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
