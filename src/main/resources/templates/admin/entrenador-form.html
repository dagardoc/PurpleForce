<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrenador | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link active" th:href="@{/admin/entrenadores}">Entrenadores</a></li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title" th:text="${entrenador.id == null ? 'Nuevo Entrenador' : 'Editar Entrenador'}"></div>
        </div>
        <a th:href="@{/admin/entrenadores}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <div class="card" style="max-width:600px;">
        <div class="card-body">
            <form th:action="@{/admin/entrenadores/guardar}" th:object="${entrenador}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" th:field="*{nombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" placeholder="Nombre"/>
                        <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="form-group">
                        <label>Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" class="form-control"
                               th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'" placeholder="Apellidos"/>
                        <div class="error-msg" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Especialidad *</label>
                    <input type="text" th:field="*{especialidad}" class="form-control"
                           th:classappend="${#fields.hasErrors('especialidad')} ? 'is-invalid'" placeholder="Ej: Yoga y Pilates"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="correo@ejemplo.com"/>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="6XX XXX XXX"/>
                    </div>
                </div>
                <div style="display:flex; gap:1rem; margin-top:0.5rem;">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar</button>
                    <a th:href="@{/admin/entrenadores}" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
