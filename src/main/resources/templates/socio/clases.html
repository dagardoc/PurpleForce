<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Clases | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/socio/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/socio/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link active" th:href="@{/socio/clases}"><i class="bi bi-calendar3"></i> Clases</a></li>
        <li><a class="nav-link" th:href="@{/socio/mis-reservas}"><i class="bi bi-bookmark-check"></i> Mis Reservas</a></li>
        <li><a class="nav-link" th:href="@{/socio/ranking}"><i class="bi bi-trophy"></i> Ranking</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-calendar3"></i> Clases disponibles</div>
            <div class="page-subtitle">Filtra y reserva tu próxima clase</div>
        </div>
    </div>

    <div th:if="${exito}" class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span></div>
    <div th:if="${error}" class="alert alert-error"><i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span></div>

    <!-- FILTROS -->
    <form th:action="@{/socio/clases}" method="get" class="filters-bar">
        <div class="form-group">
            <label><i class="bi bi-bar-chart-steps"></i> Nivel</label>
            <select name="nivel" class="form-control" th:value="${nivelFiltro}">
                <option value="">Todos los niveles</option>
                <option value="PRINCIPIANTE" th:selected="${nivelFiltro == 'PRINCIPIANTE'}">Principiante</option>
                <option value="INTERMEDIO"   th:selected="${nivelFiltro == 'INTERMEDIO'}">Intermedio</option>
                <option value="AVANZADO"     th:selected="${nivelFiltro == 'AVANZADO'}">Avanzado</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="bi bi-calendar3"></i> Fecha</label>
            <input type="date" name="fecha" class="form-control" th:value="${fechaFiltro}"/>
        </div>
        <div style="padding-bottom:0.1rem;">
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
            <a th:href="@{/socio/clases}" class="btn btn-outline" style="margin-left:0.5rem;">Limpiar</a>
        </div>
    </form>

    <!-- GRID DE CLASES -->
    <div th:if="${#lists.isEmpty(clases)}" class="card">
        <div class="card-body" style="text-align:center; padding:3rem; color:#888;">
            <i class="bi bi-calendar-x" style="font-size:3rem; display:block; margin-bottom:1rem;"></i>
            No hay clases disponibles con esos filtros
        </div>
    </div>

    <div class="clases-grid">
        <div th:each="c : ${clases}" class="clase-card" th:style="'border-top-color:' + ${c.tipoClase.color}">
            <div class="clase-card-header">
                <div class="clase-card-title" th:text="${c.tipoClase.nombre}">Clase</div>
                <span class="badge badge-purple" style="margin-top:0.3rem;" th:text="${c.tipoClase.nivel}"></span>
            </div>
            <div class="clase-card-body">
                <div class="clase-card-info">
                    <i class="bi bi-person-badge"></i>
                    <span th:text="${c.entrenador.nombreCompleto}"></span>
                </div>
                <div class="clase-card-info">
                    <i class="bi bi-calendar3"></i>
                    <span th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></span>
                </div>
                <div class="clase-card-info">
                    <i class="bi bi-clock"></i>
                    <span th:text="${#temporals.format(c.horaInicio, 'HH:mm') + ' - ' + #temporals.format(c.horaFin, 'HH:mm')}"></span>
                </div>
                <div class="clase-card-info">
                    <i class="bi bi-geo-alt"></i>
                    <span th:text="${c.sala != null ? c.sala : 'Sin sala asignada'}"></span>
                </div>
                <div class="clase-card-info">
                    <i class="bi bi-currency-euro"></i>
                    <span th:text="${c.tipoClase.precio + ' €'}"></span>
                </div>

                <!-- Barra de aforo -->
                <div style="margin-top:0.75rem;">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#888; margin-bottom:0.3rem;">
                        <span>Plazas</span>
                        <span th:text="${c.plazasOcupadas + '/' + c.aforoMaximo}"></span>
                    </div>
                    <div class="aforo-bar">
                        <div class="aforo-fill"
                             th:classappend="${c.plazasLibres == 0} ? ' lleno'"
                             th:style="'width:' + (${c.plazasOcupadas * 100 / c.aforoMaximo}) + '%'"></div>
                    </div>
                </div>
            </div>
            <div class="clase-card-footer">
                <span th:if="${c.plazasLibres > 0}" style="font-size:0.82rem; color:#27ae60; font-weight:600;">
                    <i class="bi bi-check-circle"></i> <span th:text="${c.plazasLibres + ' plazas libres'}"></span>
                </span>
                <span th:if="${c.plazasLibres == 0}" class="badge badge-danger">Clase completa</span>

                <form th:if="${c.disponible}" th:action="@{/socio/clases/{id}/reservar(id=${c.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-bookmark-plus"></i> Reservar
                    </button>
                </form>
                <button th:unless="${c.disponible}" class="btn btn-sm" disabled style="opacity:0.5; cursor:not-allowed; background:#ccc; color:#666;">
                    No disponible
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
