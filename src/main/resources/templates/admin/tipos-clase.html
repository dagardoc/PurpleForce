<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tipos de Clase | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link" th:href="@{/admin/clases}">Clases</a></li>
        <li><a class="nav-link active" th:href="@{/admin/tipos-clase}">Tipos de Clase</a></li>
        <li><a class="nav-link" th:href="@{/admin/ejercicios}">Ejercicios</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-tags"></i> Tipos de Clase</div>
            <div class="page-subtitle">Define las modalidades de clases del gimnasio</div>
        </div>
        <a th:href="@{/admin/tipos-clase/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo tipo</a>
    </div>

    <div th:if="${exito}" class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Color</th><th>Nombre</th><th>Nivel</th><th>Duración</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="7" style="text-align:center; padding:2rem; color:#888;">No hay tipos de clase</td>
                </tr>
                <tr th:each="t : ${tipos}">
                    <td>
                        <div style="width:24px; height:24px; border-radius:50%;"
                             th:style="'width:24px;height:24px;border-radius:50%;background:' + ${t.color}"></div>
                    </td>
                    <td><strong th:text="${t.nombre}"></strong></td>
                    <td><span class="badge badge-purple" th:text="${t.nivel}"></span></td>
                    <td th:text="${t.duracionMinutos + ' min'}"></td>
                    <td th:text="${t.precio + ' €'}"></td>
                    <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                        th:text="${t.descripcion != null ? t.descripcion : '-'}"></td>
                    <td>
                        <div style="display:flex; gap:0.4rem;">
                            <a th:href="@{/admin/tipos-clase/{id}/editar(id=${t.id})}" class="btn btn-outline btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/tipos-clase/{id}/eliminar(id=${t.id})}" method="post"
                                  onsubmit="return confirm('¿Eliminar este tipo de clase?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
