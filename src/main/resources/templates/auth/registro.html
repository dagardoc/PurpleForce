<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card" style="max-width:500px;">
        <div class="login-logo">
            <h1><i class="bi bi-lightning-fill"></i> PurpleForce</h1>
            <p>Crear nueva cuenta de socio</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/auth/registro}" th:object="${usuario}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" placeholder="Tu nombre"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" th:field="*{apellidos}" class="form-control"
                           th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'" placeholder="Tus apellidos"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="correo@ejemplo.com"/>
                <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Mínimo 6 caracteres"/>
                <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem; font-size:1rem; margin-top:0.5rem;">
                <i class="bi bi-person-plus-fill"></i> Crear cuenta
            </button>
        </form>

        <p style="text-align:center; margin-top:1.2rem; font-size:0.88rem; color:#888;">
            ¿Ya tienes cuenta? <a th:href="@{/auth/login}" style="color:#8e44ad; font-weight:600;">Iniciar sesión</a>
        </p>
    </div>
</div>
</body>
</html>
