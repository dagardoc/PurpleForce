<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mis Reservas | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/socio/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/socio/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link" th:href="@{/socio/clases}"><i class="bi bi-calendar3"></i> Clases</a></li>
        <li><a class="nav-link active" th:href="@{/socio/mis-reservas}"><i class="bi bi-bookmark-check"></i> Mis Reservas</a></li>
        <li><a class="nav-link" th:href="@{/socio/ranking}"><i class="bi bi-trophy"></i> Ranking</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-bookmark-check-fill"></i> Mis Reservas</div>
            <div class="page-subtitle" th:text="'Historial de ' + ${usuario.nombreCompleto}"></div>
        </div>
        <a th:href="@{/socio/mis-reservas/pdf}" class="btn btn-success">
            <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span></div>
    <div th:if="${error}" class="alert alert-error"><i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span></div>

    <div th:if="${#lists.isEmpty(reservas)}" class="card">
        <div class="card-body" style="text-align:center; padding:3rem; color:#888;">
            <i class="bi bi-bookmark-x" style="font-size:3rem; display:block; margin-bottom:1rem;"></i>
            No tienes reservas todavía.<br/>
            <a th:href="@{/socio/clases}" class="btn btn-primary" style="margin-top:1rem;">Ver clases disponibles</a>
        </div>
    </div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(reservas)}">
        <table>
            <thead>
                <tr>
                    <th>Clase</th>
                    <th>Entrenador</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Precio</th>
                    <th>Reservada el</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservas}">
                    <td><strong th:text="${r.clase.tipoClase.nombre}"></strong></td>
                    <td th:text="${r.clase.entrenador.nombreCompleto}"></td>
                    <td th:text="${#temporals.format(r.clase.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(r.clase.horaInicio, 'HH:mm')}"></td>
                    <td th:text="${r.clase.sala}"></td>
                    <td th:text="${r.clase.tipoClase.precio + ' €'}"></td>
                    <td th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${r.estado == 'CONFIRMADA'}" class="badge badge-success">Confirmada</span>
                        <span th:if="${r.estado == 'CANCELADA'}" class="badge badge-danger">Cancelada</span>
                    </td>
                    <td>
                        <form th:if="${r.estado == 'CONFIRMADA'}"
                              th:action="@{/socio/reservas/{id}/cancelar(id=${r.id})}" method="post"
                              onsubmit="return confirm('¿Cancelar esta reserva?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </form>
                        <span th:if="${r.estado == 'CANCELADA'}" style="color:#ccc; font-size:0.82rem;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
