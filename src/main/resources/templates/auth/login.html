<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <h1><i class="bi bi-lightning-fill"></i> PurpleForce</h1>
            <p>Sistema de Gestión de Gimnasio</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${exito}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span>
        </div>
        <div th:if="${logout}" class="alert alert-info">
            <i class="bi bi-info-circle-fill"></i> <span th:text="${logout}"></span>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="email"><i class="bi bi-envelope"></i> Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="tucorreo@ejemplo.com" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem; font-size:1rem; margin-top:0.5rem;">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; font-size:0.88rem; color:#888;">
            ¿No tienes cuenta?
            <a th:href="@{/auth/registro}" style="color: #8e44ad; font-weight:600;">Regístrate aquí</a>
        </p>

        <!-- Usuarios de prueba -->
        <div style="margin-top:2rem; padding:1rem; background:#f9f5fd; border-radius:10px; font-size:0.8rem; color:#666;">
            <strong style="color:#8e44ad;"><i class="bi bi-info-circle"></i> Usuarios de prueba (contraseña: 1234)</strong>
            <div style="margin-top:0.5rem; display:flex; flex-direction:column; gap:0.3rem;">
                <span>👤 Admin: <code>admin@purpleforce.com</code></span>
                <span>🏋️ Instructor: <code>carlos@purpleforce.com</code></span>
                <span>🙋 Socio: <code>alex@gmail.com</code></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
