<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ejercicio | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link active" th:href="@{/admin/ejercicios}">Ejercicios</a></li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div><div class="page-title" th:text="${ejercicio.id == null ? 'Nuevo Ejercicio' : 'Editar Ejercicio'}"></div></div>
        <a th:href="@{/admin/ejercicios}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <div class="card" style="max-width:600px;">
        <div class="card-body">
            <form th:action="@{/admin/ejercicios/guardar}" th:object="${ejercicio}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" placeholder="Ej: Sentadilla"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Grupo muscular *</label>
                        <select th:field="*{grupoMuscular}" class="form-control">
                            <option value="PIERNAS">Piernas</option>
                            <option value="PECHO">Pecho</option>
                            <option value="ESPALDA">Espalda</option>
                            <option value="BRAZOS">Brazos</option>
                            <option value="CORE">Core</option>
                            <option value="CUERPO_COMPLETO">Cuerpo completo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Dificultad *</label>
                        <select th:field="*{dificultad}" class="form-control">
                            <option value="BASICO">Básico</option>
                            <option value="INTERMEDIO">Intermedio</option>
                            <option value="AVANZADO">Avanzado</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Material necesario</label>
                    <input type="text" th:field="*{materialNecesario}" class="form-control" placeholder="Ej: Mancuernas, barra... o 'Ninguno'"/>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"
                              placeholder="Describe cómo se realiza este ejercicio..."></textarea>
                </div>
                <div style="display:flex; gap:1rem; margin-top:0.5rem;">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar</button>
                    <a th:href="@{/admin/ejercicios}" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
