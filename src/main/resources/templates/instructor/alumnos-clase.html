<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alumnos | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/instructor/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/instructor/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link active" th:href="@{/instructor/mis-clases}"><i class="bi bi-calendar3"></i> Mis Clases</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title">
                <i class="bi bi-people-fill"></i>
                Alumnos: <span th:text="${clase.tipoClase.nombre}"></span>
            </div>
            <div class="page-subtitle">
                <span th:text="${#temporals.format(clase.fecha, 'dd/MM/yyyy')}"></span> ·
                <span th:text="${#temporals.format(clase.horaInicio, 'HH:mm')}"></span> ·
                Sala: <span th:text="${clase.sala}"></span>
            </div>
        </div>
        <a th:href="@{/instructor/mis-clases}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="bi bi-list-check"></i> Lista de inscritos
            (<span th:text="${clase.plazasOcupadas + '/' + clase.aforoMaximo}"></span> plazas)
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(reservas)}" style="color:#888; text-align:center; padding:2rem;">
                No hay alumnos inscritos en esta clase
            </div>
            <div class="table-wrapper" style="box-shadow:none;" th:unless="${#lists.isEmpty(reservas)}">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Fecha de reserva</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r, iterStat : ${reservas}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${r.usuario.nombreCompleto}"></td>
                            <td th:text="${r.usuario.email}"></td>
                            <td th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${r.estado == 'CONFIRMADA'}" class="badge badge-success">Confirmada</span>
                                <span th:if="${r.estado == 'CANCELADA'}" class="badge badge-danger">Cancelada</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
