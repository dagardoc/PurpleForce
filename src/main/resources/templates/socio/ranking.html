<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ranking | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/socio/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/socio/dashboard}"><i class="bi bi-house"></i> Inicio</a></li>
        <li><a class="nav-link" th:href="@{/socio/clases}"><i class="bi bi-calendar3"></i> Clases</a></li>
        <li><a class="nav-link" th:href="@{/socio/mis-reservas}"><i class="bi bi-bookmark-check"></i> Mis Reservas</a></li>
        <li><a class="nav-link active" th:href="@{/socio/ranking}"><i class="bi bi-trophy"></i> Ranking</a></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline" style="font-size:0.82rem;"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container page-content">
    <div class="page-header">
        <div>
            <div class="page-title"><i class="bi bi-trophy-fill"></i> Ranking de Clases</div>
            <div class="page-subtitle">Las clases más populares entre los socios</div>
        </div>
    </div>

    <div class="card" style="max-width:600px; margin:0 auto;">
        <div class="card-header"><i class="bi bi-bar-chart-fill"></i> Clases más reservadas</div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(ranking)}" style="color:#888; text-align:center; padding:2rem;">
                Aún no hay suficientes datos para mostrar el ranking
            </div>
            <div th:each="item, iterStat : ${ranking}" class="ranking-item">
                <div class="ranking-pos" th:classappend="${iterStat.index < 3} ? 'top'">
                    <span th:if="${iterStat.index == 0}">🥇</span>
                    <span th:if="${iterStat.index == 1}">🥈</span>
                    <span th:if="${iterStat.index == 2}">🥉</span>
                    <span th:if="${iterStat.index >= 3}" th:text="${iterStat.index + 1}"></span>
                </div>
                <div class="ranking-name">
                    <div th:text="${item[0].nombre}" style="font-weight:700;"></div>
                    <div style="font-size:0.8rem; color:#888;" th:text="${item[0].nivel + ' · ' + item[0].duracionMinutos + ' min · ' + item[0].precio + '€'}"></div>
                </div>
                <div class="ranking-count" th:text="${item[1] + ' reservas'}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
