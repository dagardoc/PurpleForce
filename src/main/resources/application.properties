# =============================================
# PurpleForce Gym - Configuración de la app
# =============================================

# Servidor
server.port=8080

# Base de datos H2 en memoria para desarrollo
spring.datasource.url=jdbc:h2:mem:purpleforce_gym;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Carga de datos de ejemplo al arrancar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Mensajes de error detallados (desactivar en producción)
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.purpleforce=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/purpleforce.log
