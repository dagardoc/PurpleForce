<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nuevo Usuario | PurpleForce Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}"><i class="bi bi-lightning-fill"></i> Purple<span>Force</span> Gym</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li><a class="nav-link active" th:href="@{/admin/usuarios}">Usuarios</a></li>
    </ul>
</nav>
<div class="container page-content">
    <div class="page-header">
        <div><div class="page-title">Nuevo Usuario</div></div>
        <a th:href="@{/admin/usuarios}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <div class="card" style="max-width:550px;">
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error"><i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span></div>
            <form th:action="@{/admin/usuarios/nuevo}" th:object="${usuario}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                        <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="form-group">
                        <label>Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"/>
                        <div class="error-msg" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label>Contraseña *</label>
                    <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Mínimo 6 caracteres"/>
                    <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-group">
                    <label>Rol *</label>
                    <select th:field="*{rol}" class="form-control">
                        <option value="">-- Selecciona rol --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div style="display:flex; gap:1rem; margin-top:0.5rem;">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Crear usuario</button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
